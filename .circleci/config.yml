version: 2.1

jobs:
  runner-test:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - run:
          name: Verify Self-Hosted Runner
          command: |
            echo "========================================"
            echo "Self-hosted CircleCI Runner is working!"
            echo "========================================"

            echo "Hostname:"
            hostname

            echo ""
            echo "Operating System:"
            cat /etc/os-release | grep PRETTY_NAME

            echo ""
            echo "Kernel:"
            uname -a

            echo ""
            echo "CPU:"
            nproc

            echo ""
            echo "User:"
            whoami

            echo ""
            echo "Docker:"
            docker --version || echo "Docker not available"

            echo ""
            echo "Runner verification completed successfully!"

workflows:
  verify-self-hosted-runner:
    jobs:
      - runner-test
