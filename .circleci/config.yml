version: 2.1

jobs:
  secret-scan:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install TruffleHog
          command: pip install trufflehog3
      - run:
          name: Scan for secrets
          command: |
            trufflehog3 --no-history --severity MEDIUM \
              --skip-strings "123456789" \
              app/
            echo "Secret scan passed - no credentials found"

  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-{{ checksum "requirements.txt" }}
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - save_cache:
          key: deps-{{ checksum "requirements.txt" }}
          paths:
            - venv
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            pytest tests/ -v

workflows:
  secure-pipeline:
    jobs:
      - secret-scan
      - test:
          requires: [secret-scan]
