```yaml
version: 2.1

jobs:

  secret-scan:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - run:
          name: Install TruffleHog
          command: |
            python3 -m pip install --user trufflehog3

            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.local/bin:$PATH"

            which trufflehog3
            trufflehog3 --help

      - run:
          name: Scan for secrets
          command: |
            source "$BASH_ENV"

            trufflehog3 \
              --no-history \
              --severity MEDIUM \
              app/

            echo "Secret scan passed - no credentials found"


  sast-scan:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - run:
          name: Run Semgrep SAST
          command: |
            if ! command -v semgrep >/dev/null 2>&1; then
              python3 -m pip install --user semgrep
              echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
              export PATH="$HOME/.local/bin:$PATH"
            fi

            semgrep --config=p/python \
                    --config=p/secrets \
                    --error \
                    app/

            echo "SAST scan passed - no security issues found"


  test:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - restore_cache:
          keys:
            - deps-{{ checksum "requirements.txt" }}

      - run:
          name: Install dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt

      - save_cache:
          key: deps-{{ checksum "requirements.txt" }}
          paths:
            - venv

      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            pytest tests/ -v


  build-and-scan:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - run:
          name: Build Docker image
          command: |
            docker build \
              -t $DOCKER_USER/tokenizer:$CIRCLE_SHA1 \
              .

      - run:
          name: Install Trivy
          command: |
            if ! command -v trivy >/dev/null 2>&1; then
              mkdir -p "$HOME/bin"

              curl -sfL \
                https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                | sh -s -- -b "$HOME/bin"

              echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"
              export PATH="$HOME/bin:$PATH"
            fi

            trivy --version

      - run:
          name: Scan image for vulnerabilities
          command: |
            source "$BASH_ENV"

            trivy image \
              --exit-code 1 \
              --severity CRITICAL \
              --no-progress \
              $DOCKER_USER/tokenizer:$CIRCLE_SHA1

            echo "Container scan passed - no CRITICAL CVEs found"

      - run:
          name: Push image to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | \
              docker login \
              -u "$DOCKER_USER" \
              --password-stdin

            docker push \
              $DOCKER_USER/tokenizer:$CIRCLE_SHA1


  deploy:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - run:
          name: Simulate deployment
          command: |
            echo "Deploying image: $DOCKER_USER/tokenizer:$CIRCLE_SHA1"
            echo "All PCI controls passed - safe to deploy"
            echo "Deploy complete"


workflows:

  secure-pipeline:
    jobs:

      - secret-scan

      - sast-scan

      - test:
          requires:
            - secret-scan
            - sast-scan

      - build-and-scan:
          requires:
            - test

      - hold-for-approval:
          type: approval
          requires:
            - build-and-scan

      - deploy:
          requires:
            - hold-for-approval
```
