version: 2.1

jobs:
  secret-scan:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install TruffleHog
          command: pip install trufflehog3
      - run:
          name: Scan for secrets
          command: |
            trufflehog3 --no-history --severity MEDIUM app/
            echo "Secret scan passed - no credentials found"

  sast-scan:
    docker:
      - image: returntocorp/semgrep
    steps:
      - checkout
      - run:
          name: Run Semgrep SAST
          command: |
            semgrep --config=p/python \
                    --config=p/secrets \
                    --error \
                    --verbose \
                    app/
            echo "SAST scan passed - no security issues found"

  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-{{ checksum "requirements.txt" }}
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install -r requirements.txt
      - save_cache:
          key: deps-{{ checksum "requirements.txt" }}
          paths:
            - venv
      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            pytest tests/ -v

workflows:
  secure-pipeline:
    jobs:
      - secret-scan
      - sast-scan
      - test:
          requires: [secret-scan, sast-scan]
