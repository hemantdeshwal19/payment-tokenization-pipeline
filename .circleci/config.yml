version: 2.1

jobs:

  secret-scan:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - run:
          name: Run TruffleHog Secret Scan
          command: |
            docker run --rm \
              -v "$PWD:/repo:ro" \
              trufflesecurity/trufflehog:latest \
              filesystem \
              /repo/app

  sast-scan:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - run:
          name: Run Semgrep SAST
          command: |
            docker run --rm \
              -v "$PWD:/src:ro" \
              semgrep/semgrep \
              semgrep \
              --config=p/python \
              --config=p/secrets \
              --error \
              /src/app

  test:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - restore_cache:
          keys:
            - deps-{{ checksum "requirements.txt" }}

      - run:
          name: Install dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - save_cache:
          key: deps-{{ checksum "requirements.txt" }}
          paths:
            - venv

      - run:
          name: Run tests
          command: |
            . venv/bin/activate
            pytest tests/ -v

  build-and-scan:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - run:
          name: Verify Docker
          command: |
            docker --version
            docker info

      - run:
          name: Build Docker image
          command: |
            docker build \
              -t "$DOCKER_USER/tokenizer:$CIRCLE_SHA1" \
              .

      - run:
          name: Pull Trivy Scanner
          command: |
            docker pull aquasec/trivy:latest

      - run:
          name: Scan Docker image
          command: |
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:latest \
              image \
              --exit-code 1 \
              --severity CRITICAL \
              --no-progress \
              "$DOCKER_USER/tokenizer:$CIRCLE_SHA1"

      - run:
          name: Push image to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | \
              docker login \
              --username "$DOCKER_USER" \
              --password-stdin

            docker push \
              "$DOCKER_USER/tokenizer:$CIRCLE_SHA1"

  deploy:
    machine: true
    resource_class: hemantdeshwal19/hemant-runner

    steps:
      - checkout

      - run:
          name: Simulate deployment
          command: |
            echo "Deploying image: $DOCKER_USER/tokenizer:$CIRCLE_SHA1"
            echo "All PCI controls passed - safe to deploy"
            echo "Deploy complete"

workflows:

  secure-pipeline:
    jobs:

      - secret-scan

      - sast-scan

      - test:
          requires:
            - secret-scan
            - sast-scan

      - build-and-scan:
          requires:
            - test

      - hold-for-approval:
          type: approval
          requires:
            - build-and-scan

      - deploy:
          requires:
            - hold-for-approval
